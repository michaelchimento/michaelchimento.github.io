{% include base_path %}

<div class="list__item publication">
  <article class="archive__item" itemscope itemtype="http://schema.org/CreativeWork">
    <div class="publication__title" itemprop="headline">
      {% if post.link %}<a href="{{ post.link }}">{{ post.title }}</a>{% else %}{{ post.title }}{% endif %}
    </div>
    <div class="publication__meta">{{ post.type }}, <i>{{ post.venue }}</i> ({{ post.date | default: "1900-01-01" | date: "%Y" }})</div>
  </article>
</div>
